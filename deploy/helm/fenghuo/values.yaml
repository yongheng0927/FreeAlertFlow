# Fenghuo（烽火台）Helm chart 默认配置
# 所有应用配置均通过 FENGHUO_* 环境变量注入

image:
  repository: fenghuo
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

# 外部访问地址（FR-6），反向代理/子路径部署时改成实际地址
rootUrl: "http://localhost:8080/"

# 外部 PostgreSQL（必填，chart 不再内置数据库）
database:
  host: ""        # 必填：外部 PostgreSQL 地址，留空时安装直接报错
  port: 5432
  user: fenghuo
  # 数据库密码。secrets.existingSecret 为空时必填，由 chart 写入生成的 Secret
  password: ""
  dbname: fenghuo
  sslmode: disable

# 密钥管理：FENGHUO_JWT_SECRET / 数据库密码
# 两种方式二选一：
#   1. existingSecret 指向预先创建好的 Secret，须包含 key：
#      jwt-secret / database-password
#   2. existingSecret 留空，由 chart 用下面的值生成 Secret（两者均必填）
secrets:
  existingSecret: ""
  jwtSecret: ""

logLevel: info

alert:
  dedupWindow: 5m
  retentionDays: 30

channel:
  httpTimeout: 10s
  retryMax: 2

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: higress
  host: fenghuo.local
  # 开启 ingress 后建议把 rootUrl 改为 http://<host>/

resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 256Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
