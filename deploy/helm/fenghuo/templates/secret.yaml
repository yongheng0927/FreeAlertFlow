{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fenghuo.secretName" . }}
  labels:
    {{- include "fenghuo.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret: {{ required "secrets.jwtSecret 必填（--set secrets.jwtSecret=xxx）；或改用 secrets.existingSecret" .Values.secrets.jwtSecret | quote }}
  database-password: {{ required "database.password 必填（--set database.password=xxx）；或改用 secrets.existingSecret" .Values.database.password | quote }}
{{- end }}
