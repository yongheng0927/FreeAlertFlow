# FreeAlertFlow 一键 demo：app + PostgreSQL 18
# 用法：cp docker-compose.example.yaml docker-compose.yaml（按需修改），
# 然后 docker compose up -d --build，访问 http://localhost:8080
# 数据库不对外暴露端口，仅 compose 内部网络可达

services:
  app:
    build: .
    image: freealertflow:latest
    container_name: faf-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      FAF_SERVER_HTTP_ADDR: ":8080"
      # 外部访问地址，反向代理/子路径部署时改成实际地址（FR-6）
      FAF_SERVER_ROOT_URL: "http://localhost:8080/"
      FAF_DATABASE_HOST: "db"
      FAF_DATABASE_PORT: "5432"
      FAF_DATABASE_USER: "faf"
      FAF_DATABASE_PASSWORD: "faf"
      FAF_DATABASE_DBNAME: "freealertflow"
      FAF_DATABASE_SSLMODE: "disable"
      # 必须正好 32 字节，以下是仅用于 demo 的弱密钥，生产环境务必通过
      # 环境变量覆盖：FAF_SECRET_KEY=xxx docker compose up -d
      FAF_SECRET_KEY: "${FAF_SECRET_KEY:-faf-dev-secret-key-0123456789abc}"
      FAF_JWT_SECRET: "${FAF_JWT_SECRET:-faf-dev-jwt-secret-change-me}"
      # 首次启动自动创建的初始管理员（FR-5.1），生产环境务必覆盖
      FAF_ADMIN_USER: "${FAF_ADMIN_USER:-admin}"
      FAF_ADMIN_PASSWORD: "${FAF_ADMIN_PASSWORD:-admin123456}"
      FAF_LOG_LEVEL: "info"
      # 出站代理：服务器无法直连外网（如飞书 webhook）时，在 .env 或 shell 里
      # 设置 HTTPS_PROXY=http://host:7897 即可，留空表示直连；
      # Go HTTP 客户端自动读取这组标准变量
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1}"
      # 容器时区：日志时间戳和通知消息里的时间都按 time.Local 输出，
      # 不设则容器回退 UTC（镜像已装 tzdata，Go 直接按 TZ 解析）
      TZ: "${TZ:-Asia/Shanghai}"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    container_name: faf-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: faf
      POSTGRES_PASSWORD: faf
      POSTGRES_DB: freealertflow
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faf -d freealertflow"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
