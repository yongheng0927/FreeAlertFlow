# Fenghuo（烽火台） 示例配置
# 每项设置也可以通过 FENGHUO_ 前缀的环境变量提供（点号变为下划线），
# 例如 server.http_addr -> FENGHUO_SERVER_HTTP_ADDR
# 优先级：环境变量 > 本文件 > 内置默认值
# 复制为 config.yaml 后按需修改；config.yaml 已被 git 忽略

server:
  http_addr: ":8080"                     # FENGHUO_SERVER_HTTP_ADDR
  root_url: "http://localhost:8080/"     # FENGHUO_SERVER_ROOT_URL

database:
  # 必填项：user / password / dbname；host / port / sslmode 有默认值
  host: "localhost"     # FENGHUO_DATABASE_HOST
  port: 5432            # FENGHUO_DATABASE_PORT
  user: "faf"           # FENGHUO_DATABASE_USER
  password: "pass"      # FENGHUO_DATABASE_PASSWORD
  dbname: "freealertflow"  # FENGHUO_DATABASE_DBNAME
  sslmode: "disable"    # FENGHUO_DATABASE_SSLMODE

# 必填，必须恰好 32 字节，用于敏感字段加密的 AES-256-GCM 密钥
# FENGHUO_SECRET_KEY —— 请替换为你自己的随机 32 字节值
secret_key: "0123456789abcdef0123456789abcdef"

jwt:
  # FENGHUO_JWT_SECRET；留空时启动时会生成随机密钥（并输出警告），
  # 重启后所有 token 失效
  secret: ""
  access_ttl: "2h"     # FENGHUO_JWT_ACCESS_TTL
  refresh_ttl: "168h"  # FENGHUO_JWT_REFRESH_TTL（7 天）

# 初始管理员，仅在数据库中没有任何用户时使用（FR-5.1）
admin:
  user: ""      # FENGHUO_ADMIN_USER
  password: ""  # FENGHUO_ADMIN_PASSWORD

log:
  level: "info"  # FENGHUO_LOG_LEVEL：debug / info / warn / error

alert:
  dedup_window: "5m"  # FENGHUO_ALERT_DEDUP_WINDOW，0 表示关闭去重
  retention_days: 30  # FENGHUO_ALERT_RETENTION_DAYS

channel:
  http_timeout: "10s"  # FENGHUO_CHANNEL_HTTP_TIMEOUT
  retry_max: 2         # FENGHUO_CHANNEL_RETRY_MAX，0 表示关闭重试

# OAuth（M4，占位——M1 中尚不可用）
oauth:
  enabled: false          # FENGHUO_OAUTH_ENABLED
  feishu_app_id: ""       # FENGHUO_OAUTH_FEISHU_APP_ID
  feishu_app_secret: ""   # FENGHUO_OAUTH_FEISHU_APP_SECRET
  auto_create_user: true  # FENGHUO_OAUTH_AUTO_CREATE_USER
  allowed_emails: []      # FENGHUO_OAUTH_ALLOWED_EMAILS（通过环境变量配置时用逗号分隔）
